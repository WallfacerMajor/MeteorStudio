name: Build MeteorStudio

on:
  workflow_dispatch:
    inputs:
      version:
        description: DMG version label
        required: false
        default: 0.3.4
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and virtual display
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check source syntax
        run: python -m compileall -q .
      - name: Run focused editor interaction checks
        run: |
          xvfb-run -a python release_live_smoke.py
          xvfb-run -a python release_color_smoke.py
          xvfb-run -a python release_video_smoke.py
          xvfb-run -a python project_import_smoke.py
          xvfb-run -a python recommendation_controls_smoke.py

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Build Windows application
        shell: cmd
        run: build_windows.bat < nul
      - name: Archive Windows application
        shell: pwsh
        run: Compress-Archive -Path dist/MeteorStudio -DestinationPath MeteorStudio-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MeteorStudio-Windows-x64
          path: MeteorStudio-Windows-x64.zip

  macos:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Build APP and DMG
        run: |
          chmod +x build_macos.command create_macos_dmg.command build_macos_dmg.command
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="$(sed -n 's/^APP_VERSION = "\([^"]*\)"/\1/p' meteor_composer.py | head -1)"
            fi
          fi
          ./build_macos_dmg.command "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: MeteorStudio-macOS-${{ matrix.architecture }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read application version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^APP_VERSION = "\([^"]*\)"/\1/p' meteor_composer.py | head -1)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.value) }}
          target_commitish: ${{ github.sha }}
          name: MeteorStudio v${{ steps.version.outputs.value }}
          files: release-assets/**/*
          generate_release_notes: true
